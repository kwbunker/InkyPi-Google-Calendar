{% extends "plugin.html" %}

{% block content %}

<script src="{{static_dir}}/scripts/calendar.min.js" charset="UTF-8"></script>

{% if view == 'timeGrid2Week' %}
<div class="two-week" style="--font-scale: {{ font_scale }}; --fit-scale: 1; --fc-border-color: {{ plugin_settings.textColor or 'black' }}; --fc-page-bg-color: {{ plugin_settings.backgroundColor or 'white' }}; --fc-today-bg-color: transparent;">
    <div id="week-1" class="calendar week"></div>
    <div id="week-2" class="calendar week"></div>
</div>
{% else %}
<div id="calendar" class="calendar" style="
--fc-page-bg-color: {{ plugin_settings.backgroundColor or 'white' }};
--fc-border-color: {{ plugin_settings.textColor or 'black' }};
--fc-today-bg-color: transparent;
--fc-now-indicator-color: {{ plugin_settings.nowIndicatorColor or 'red' }};
--fc-event-border-color: {{ plugin_settings.textColor or 'black' }};
--fc-small-font-size: {{ 0.85 * font_scale }}em;
--fc-title-font-size: {{ 1.75 * font_scale }}em;
--fc-table-font-size: {{ 1 * font_scale }}em;
"></div>
{% endif %}
<div class="updated-stamp">Updated {{ updated }}</div>

<script>
    const events = {{ events | tojson }};
    const showEventTime = {{ (plugin_settings.displayEventTime == "true") | tojson }};
    const showEventDetails = {{ (plugin_settings.displayEventDetails == "true") | tojson }};

    function textBlock(className, text) {
        const block = document.createElement('div');
        block.className = className;
        block.textContent = text;
        return block;
    }

    // Built with textContent so a title containing < or & can't break the page.
    function renderEvent(arg) {
        const bubble = document.createElement('div');
        bubble.className = 'event-bubble';
        const time = arg.event.allDay ? 'All Day' : arg.timeText;
        if (showEventTime && time) {
            bubble.appendChild(textBlock('event-time', time));
        }
        bubble.appendChild(textBlock('event-title', arg.event.title));
        if (showEventDetails) {
            const { location, description } = arg.event.extendedProps;
            if (location) {
                bubble.appendChild(textBlock('event-detail', location));
            }
            if (description) {
                bubble.appendChild(textBlock('event-detail', description.length > 50 ? description.substring(0, 50) + '...' : description));
            }
        }
        return { domNodes: [bubble] };
    }

    document.addEventListener('DOMContentLoaded', function () {
        const is12Hour = {{ (time_format == "12h") | tojson }};
        const timeFormat = {
            hour: "numeric",
            minute: "2-digit",
            omitZeroMinute: false,
            hour12: is12Hour,
            meridiem: 'short'
        };
        const commonOptions = {
            events: events,
            now: '{{ current_dt }}',
            // Times arrive already converted to the device's time zone, with no offset.
            timeZone: 'UTC',
            contentHeight: '100%',
            expandRows: true,
            locale: "{{ plugin_settings.language or 'en' }}",
            firstDay: {{ first_day }},
            eventTimeFormat: timeFormat,
            displayEventTime: showEventTime,
            weekends: {{ (plugin_settings.displayWeekends == "true") | tojson }}
        };

        {% if view == 'timeGrid2Week' %}
        const weekStarts = {{ week_starts | tojson }};
        const dateRow = {{ date_row | tojson }};
        const container = document.querySelector('.two-week');
        const weeks = ['week-1', 'week-2'].map(id => document.getElementById(id));
        const FIT_STEP = 0.05;
        const SMALLEST_FIT = 0.6;
        let calendars = [];

        // The row goes inside the date's own cell, so it reads as part of the date. Days with
        // no titles still get an empty one, which keeps the line under the dates unbroken.
        function renderDayHeader(arg) {
            const nodes = [textBlock('day-date', arg.text)];
            if (dateRow) {
                const row = document.createElement('div');
                row.className = 'date-row';
                (dateRow[arg.date.toISOString().slice(0, 10)] || []).forEach(title => {
                    row.appendChild(textBlock('date-row-title', title));
                });
                nodes.push(row);
            }
            return { domNodes: nodes };
        }

        function renderWeeks(fitScale, limitEvents) {
            container.style.setProperty('--fit-scale', fitScale);
            calendars.forEach(calendar => calendar.destroy());
            weeks.forEach(week => { week.style.flex = ''; });
            calendars = weeks.map((week, index) => {
                const calendar = new FullCalendar.Calendar(week, {
                    ...commonOptions,
                    initialView: 'dayGridWeek',
                    initialDate: weekStarts[index],
                    headerToolbar: false,
                    dayHeaderFormat: { weekday: 'short', month: 'numeric', day: 'numeric', omitCommas: true },
                    dayHeaderContent: renderDayHeader,
                    displayEventEnd: true,
                    dayMaxEvents: limitEvents,
                    eventDisplay: 'block',
                    eventContent: renderEvent
                });
                calendar.render();
                return calendar;
            });
            weeks.forEach(fitLongWords);
        }

        // A word too wide for its box, such as "Thanksgiving" in one day, would break
        // mid-word. Its title shrinks to fit instead, down to 70%, and only then breaks.
        function fitLongWords(week) {
            week.querySelectorAll('.event-title').forEach(title => {
                if (title.scrollWidth <= title.clientWidth) {
                    return;
                }
                const size = parseFloat(getComputedStyle(title).fontSize);
                for (let percent = 95; percent >= 70 && title.scrollWidth > title.clientWidth; percent -= 5) {
                    title.style.fontSize = `${size * percent / 100}px`;
                }
                if (title.scrollWidth > title.clientWidth) {
                    title.style.overflowWrap = 'break-word';
                }
            });
        }

        function headerHeight(week) {
            const top = week.getBoundingClientRect().top;
            const header = week.querySelector('.fc-col-header');
            return header ? header.getBoundingClientRect().bottom - top : 0;
        }

        // How tall a week would be with nothing cut off, whatever height it has now.
        function heightNeeded(week) {
            const top = week.getBoundingClientRect().top;
            let bottom = top + headerHeight(week);
            week.querySelectorAll('.fc-daygrid-event-harness').forEach(event => {
                bottom = Math.max(bottom, event.getBoundingClientRect().bottom);
            });
            return bottom - top + 12;
        }

        // Moves the line between the weeks so a busy week can use a quiet week's spare room.
        function shareHeight(needed, total) {
            if (needed[0] <= total / 2 && needed[1] <= total / 2) {
                return;
            }
            const spare = (total - needed[0] - needed[1]) / 2;
            weeks.forEach((week, index) => { week.style.flex = `0 0 ${needed[index] + spare}px`; });
            calendars.forEach(calendar => calendar.updateSize());
            weeks.forEach(fitLongWords);
        }

        function heightsAt(scale) {
            renderWeeks(scale, false);
            return weeks.map(heightNeeded);
        }

        // Finds the largest size that fits, starting from an estimate to keep renders few,
        // because each one is slow on a Pi Zero. A week that's still too full at the smallest
        // size shows "+N more" rather than silently losing events.
        function fitWeeks() {
            const total = container.clientHeight;
            const fits = heights => heights[0] + heights[1] <= total;
            const step = (scale, direction) => Math.round((scale + direction * FIT_STEP) * 100) / 100;

            let needed = heightsAt(1);
            if (!fits(needed)) {
                const headers = headerHeight(weeks[0]) + headerHeight(weeks[1]);
                const estimate = (total - headers) / (needed[0] + needed[1] - headers);
                let scale = Math.max(SMALLEST_FIT, Math.floor(estimate / FIT_STEP) * FIT_STEP);
                scale = Math.round(scale * 100) / 100;
                needed = heightsAt(scale);
                while (!fits(needed) && scale > SMALLEST_FIT) {
                    scale = step(scale, -1);
                    needed = heightsAt(scale);
                }
                if (!fits(needed)) {
                    renderWeeks(SMALLEST_FIT, true);
                    return;
                }
                // Smaller text wraps less, so the estimate can be more cautious than it needs to be.
                while (scale < 1) {
                    const larger = heightsAt(step(scale, 1));
                    if (!fits(larger)) {
                        needed = heightsAt(scale);
                        break;
                    }
                    scale = step(scale, 1);
                    needed = larger;
                }
            }
            shareHeight(needed, total);
        }

        fitWeeks();
        // Text measures differently once the real font has loaded, so fit again if it hadn't.
        if (document.fonts.status !== 'loaded') {
            document.fonts.ready.then(fitWeeks);
        }
        {% else %}
        new FullCalendar.Calendar(document.getElementById('calendar'), {
            ...commonOptions,
            initialView: '{{ view }}',
            slotDuration: '01:00:00',
            slotLabelFormat: timeFormat,
            slotMinTime: "{{ plugin_settings.startTimeInterval or '00' }}:00:00",
            slotMaxTime: "{{ plugin_settings.endTimeInterval or 24 }}:00:00",
            nowIndicator: {{ (plugin_settings.displayNowIndicator == "true") | tojson }},
            fixedWeekCount: false,
            {% if view == 'timeGrid' %}duration: { days: 7 },{% endif %}
            headerToolbar: {
                left: '',
                center: "{{ 'title' if plugin_settings.displayTitle == 'true' else '' }}",
                right: ''
            },
            {% if plugin_settings.displayEventDetails == "true" %}eventContent: renderEvent{% endif %}
        }).render();
        {% endif %}
    });
</script>

{% endblock %}
